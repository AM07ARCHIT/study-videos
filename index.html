
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Videos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #000000;
      color: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
    }

    /* 4 BUTTONS */

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      border: 1px solid #2f2f2f;
      border-radius: 8px;

      padding: 11px 10px;

      background: #1f1f1f;
      color: #d4d4d4;

      font-size: 13px;
      font-weight: 500;

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.08s ease;
    }

    button:hover {
      background: #2a2a2a;
      color: #ffffff;
    }

    button:active {
      transform: scale(0.98);
    }

    button.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    /* VIDEO */

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;

      overflow: hidden;

      border-radius: 10px;
      background: #000000;

      border: 1px solid #242424;
    }

    iframe {
      position: absolute;

      width: 100%;
      height: 100%;

      left: 0;
      top: 0;

      border: none;
    }

    /* MOBILE */

    @media (max-width: 500px) {
      .buttons {
        grid-template-columns: 1fr;
      }

      body {
        padding: 6px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="buttons">

      <button
        class="active"
        onclick="changeVideo('m2DVoPrVF9U', this)">
        ▶ Study 1
      </button>

      <button
        onclick="changeVideo('Qo7N-HbEMxE', this)">
        ▶ Study 2
      </button>

      <button
        onclick="changeVideo('g6QSU_hr70s', this)">
        ▶ Study 3
      </button>

      <button
        onclick="changeVideo('p3ynjjRbU9A', this)">
        ▶ Study 4
      </button>

    </div>

    <div class="video-wrapper">

      <iframe
        id="youtubePlayer"
        src="https://www.youtube.com/embed/m2DVoPrVF9U"
        title="Study Video"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share
        "
        allowfullscreen>
      </iframe>

    </div>

  </div>


  <script>

    function changeVideo(videoId, button) {

      const player =
        document.getElementById("youtubePlayer");

      player.src =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1";

      document
        .querySelectorAll("button")
        .forEach(btn => {
          btn.classList.remove("active");
        });

      button.classList.add("active");
    }

  </script>

</body>
</html>
